<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3a0f52">
<title>Jhandi Munda</title>
<style>
:root{--gap:2.2vmin;--ivory:#fffdf6;--marigold:#f2a81d;--ink:#1a1b2e}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#3a0f52;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

/* Always plays in landscape: in portrait the layout is turned 90 degrees. */
#app{position:fixed;inset:0;display:flex;gap:var(--gap);padding:var(--gap);
  background:linear-gradient(125deg,#2a0b4d,#6b1b6e,#c93a4f,#f08a24,#6b1b6e,#2a0b4d);
  background-size:300% 300%;animation:flow 22s ease-in-out infinite}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(20,4,36,.55) 100%)}
@keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@media (orientation:portrait){
  #app{inset:auto;top:0;left:100%;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
}
@supports (width:100dvh){
  @media (orientation:portrait){#app{width:100dvh;height:100dvw}}
}

.grid{position:relative;flex:1;min-width:0;min-height:0;display:grid;gap:var(--gap);
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
.card{position:relative;perspective:1200px;min-width:0;min-height:0}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.3,1)}
.inner.blank{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:2.6vmin;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:box-shadow .3s}
/* front: champagne-gold premium card with a double gold frame and a soft sheen */
.front{--frame:inset 0 0 0 .4vmin #b98a2e,inset 0 0 0 1.2vmin #f7e9c2,inset 0 0 0 1.5vmin #c9a24a;
  background:linear-gradient(145deg,#fbf1d6 0%,#ecd7a3 45%,#f8e9c0 70%,#e2c37e 100%);
  box-shadow:var(--frame),0 .8vmin 2vmin rgba(0,0,0,.5)}
.front::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,transparent 36%,rgba(255,255,255,.5) 50%,transparent 64%)}
/* blank state: deep midnight card with a gold foil frame, nothing printed on it */
.back{transform:rotateY(180deg);
  background:repeating-linear-gradient(45deg,rgba(212,174,90,.07) 0 .6vmin,transparent .6vmin 1.9vmin),
    radial-gradient(circle at 50% 38%,#33284d 0%,#1a1430 65%,#0d0a1a 100%);
  box-shadow:inset 0 0 0 .4vmin #b98a2e,inset 0 0 0 1.4vmin #1a1430,inset 0 0 0 1.7vmin rgba(212,174,90,.75),0 .8vmin 2vmin rgba(0,0,0,.5)}
.art{position:absolute;inset:13% 20%}
.art svg,.idx svg{width:100%;height:100%;display:block}
.idx{position:absolute;width:13%;height:21%;top:5%;left:4.5%}
.idx.b{top:auto;left:auto;bottom:5%;right:4.5%;transform:rotate(180deg)}

/* drawing animation: symbol keeps changing, card glows */
.inner.rolling .front{box-shadow:var(--frame),0 0 0 .6vmin var(--marigold),0 0 3vmin rgba(242,168,29,.85),0 .8vmin 2vmin rgba(0,0,0,.45)}
/* matching cards (two or more of the same symbol): lift up and glow */
.inner.match{transform:translateY(-1.9vmin)}
.inner.match .front{box-shadow:var(--frame),0 0 0 .5vmin #ffd45a,0 0 3.4vmin rgba(255,212,90,.95),0 2.4vmin 3vmin rgba(0,0,0,.5)}
.inner.rolling .art{animation:tick .16s ease-in-out infinite alternate}
@keyframes tick{from{transform:scale(.88) translateY(7%);filter:blur(1.2px)}to{transform:scale(1.02) translateY(-5%);filter:blur(.4px)}}
.inner.land .art{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}

.rail{position:relative;width:clamp(80px,14vmax,140px);display:flex}
#go{flex:1;border:0;border-radius:2.6vmin;font:800 clamp(17px,3.6vmin,30px) system-ui,sans-serif;
  cursor:pointer;touch-action:manipulation;box-shadow:0 .8vmin 2vmin rgba(0,0,0,.45);transition:background .2s,color .2s}
#go:active{transform:scale(.96)}
#go.draw{background:var(--marigold);color:var(--ink)}
#go.ready{background:var(--ivory);color:#6b1b6e}
#go.err{animation:err .3s 2}
@keyframes err{50%{transform:translateX(-6px)}}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  #app{animation:none}
  .inner{transition-duration:.01s}
  .inner.rolling .art,.inner.land .art{animation:none}
}
</style>
</head>
<body>
<div id="app">
  <div class="grid" id="grid"></div>
  <div class="rail"><button id="go" class="draw">Draw</button></div>
</div>

<script>
const SYMBOLS = ["flag","crown","heart","spade","diamond","club"];
const RED = "#c8202f", BLACK = "#15151f", GOLD = "#f0b323", GOLD_D = "#8a5a00";
const svg = body => '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">' + body + '</svg>';

const flagHalf = fill => (
    '<line x1="38" y1="10" x2="80" y2="96" stroke="#2b1d0e" stroke-width="4.5" stroke-linecap="round"/>' +
    '<circle cx="38" cy="9" r="4" fill="'+GOLD+'" stroke="'+GOLD_D+'" stroke-width="1.5"/>' +
    '<path d="M38 12C28 6 18 19 7 12L13 34C23 40 33 28 47 33Z" fill="'+fill+'" stroke="#4a4a5c" stroke-width="1.2" stroke-linejoin="round"/>');
const ART = {
  flag: svg(
    '<g>' + flagHalf(BLACK) + '</g>' +
    '<g transform="translate(100 0) scale(-1 1)">' + flagHalf(BLACK) + '</g>' +
    '<circle cx="50" cy="35" r="3.2" fill="#2b1d0e"/>'),
  crown: svg(
    '<path d="M12 78L7 32L30 54L50 16L70 54L93 32L88 78Z" fill="'+BLACK+'" stroke="#000" stroke-width="3" stroke-linejoin="round"/>' +
    '<rect x="11" y="80" width="78" height="14" rx="3" fill="'+BLACK+'" stroke="#000" stroke-width="3"/>' +
    '<circle cx="7" cy="30" r="5" fill="'+BLACK+'" stroke="#000" stroke-width="2"/>' +
    '<circle cx="50" cy="13" r="5" fill="'+BLACK+'" stroke="#000" stroke-width="2"/>' +
    '<circle cx="93" cy="30" r="5" fill="'+BLACK+'" stroke="#000" stroke-width="2"/>' +
    '<path d="M20 70L17 44L30 58M80 70L83 44L70 58" fill="none" stroke="#5a5a6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="28" cy="87" r="3" fill="#cfc9b6"/><circle cx="50" cy="87" r="3" fill="#cfc9b6"/><circle cx="72" cy="87" r="3" fill="#cfc9b6"/>'),
  heart: svg('<path d="M50 90C20 64 7 47 7 30C7 17 17 8 30 8C39 8 46 13 50 21C54 13 61 8 70 8C83 8 93 17 93 30C93 47 80 64 50 90Z" fill="'+RED+'"/>'),
  spade: svg('<path d="M50 4C50 4 92 34 92 58C92 72 80 81 68 81C60 81 54 77 52 71C53 81 57 90 66 96L34 96C43 90 47 81 48 71C46 77 40 81 32 81C20 81 8 72 8 58C8 34 50 4 50 4Z" fill="'+BLACK+'"/>'),
  diamond: svg('<path d="M50 3C58 24 74 38 91 50C74 62 58 76 50 97C42 76 26 62 9 50C26 38 42 24 50 3Z" fill="'+RED+'"/>'),
  club: svg(
    '<g fill="'+BLACK+'"><circle cx="50" cy="28" r="21"/><circle cx="26" cy="62" r="21"/><circle cx="74" cy="62" r="21"/>' +
    '<circle cx="50" cy="54" r="12"/><path d="M50 50C50 74 46 86 37 96L63 96C54 86 50 74 50 50Z"/></g>')
};

const wait = ms => new Promise(r => setTimeout(r, ms));
function face(s){
  return '<div class="idx">'+ART[s]+'</div><div class="art">'+ART[s]+'</div><div class="idx b">'+ART[s]+'</div>';
}

const grid = document.getElementById("grid");
const cards = [];
for (let i = 0; i < 6; i++) {
  const c = document.createElement("div");
  c.className = "card";
  c.innerHTML = '<div class="inner blank"><div class="face front"></div><div class="face back"></div></div>';
  grid.appendChild(c);
  cards.push({ inner: c.querySelector(".inner"), front: c.querySelector(".front"), cur: null, timer: null });
}

const btn = document.getElementById("go");
let run = 0, mode = "draw";
function setMode(m){ mode = m; btn.textContent = m === "draw" ? "Draw" : "Ready"; btn.className = m; }

function goFullscreen(){
  try {
    const el = document.documentElement;
    const p = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen && el.webkitRequestFullscreen());
    Promise.resolve(p).then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape")).catch(() => {});
  } catch (e) {}
}

function showRandom(c){
  let s; do { s = SYMBOLS[Math.floor(Math.random() * 6)]; } while (s === c.cur);
  c.cur = s; c.front.innerHTML = face(s);
}

function reset(){
  run++;
  cards.forEach(c => { clearInterval(c.timer); c.inner.classList.remove("rolling", "land", "match"); c.inner.classList.add("blank"); });
  setMode("draw");
}

async function startDraw(){
  const my = ++run;
  setMode("ready");
  cards.forEach((c, i) => {
    clearInterval(c.timer);
    showRandom(c);
    c.inner.classList.remove("blank", "land", "match");
    c.inner.classList.add("rolling");
    c.timer = setInterval(() => showRandom(c), 85 + i * 14);
  });

  let dice;
  try {
    const [r] = await Promise.all([
      fetch("/api/draw", { method: "POST" }).then(x => { if (!x.ok) throw new Error(); return x.json(); }),
      wait(1700)
    ]);
    dice = r.dice;
  } catch (e) {
    if (my !== run) return;
    reset();
    btn.classList.add("err"); setTimeout(() => btn.classList.remove("err"), 700);
    return;
  }

  for (let i = 0; i < 6; i++) {
    if (my !== run) return;
    const c = cards[i];
    clearInterval(c.timer);
    c.cur = dice[i]; c.front.innerHTML = face(dice[i]);
    c.inner.classList.remove("rolling");
    c.inner.classList.add("land");
    await wait(380);
  }
  await wait(150);
  if (my !== run) return;
  const counts = {};
  dice.forEach(s => counts[s] = (counts[s] || 0) + 1);
  cards.forEach((c, i) => { if (counts[dice[i]] >= 2) c.inner.classList.add("match"); });
}

btn.onclick = () => { goFullscreen(); if (mode === "draw") startDraw(); else reset(); };
</script>
</body>
</html>
